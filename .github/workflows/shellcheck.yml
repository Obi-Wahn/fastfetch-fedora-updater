name: Shell Script Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bash-Syntax prüfen (bash -n)
        run: |
          set -uo pipefail
          status=0
          shopt -s nullglob
          for f in *.sh; do
            echo "== bash -n $f =="
            bash -n "$f" || status=1
          done
          exit "$status"

      - name: ShellCheck ausführen
        run: |
          set -uo pipefail
          status=0
          shopt -s nullglob
          for f in *.sh; do
            echo "== shellcheck -x $f =="
            shellcheck -x "$f" || status=1
          done
          exit "$status"
